<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="654" viewBox="0 0 1200 654" role="img" aria-labelledby="title desc"><title id="title">ArguLab development milestones</title><desc id="desc">August prototype and expanded practice platform; September 12 v2.0.1, deployment split and rename; September 19 v3.0.1 workspaces, speech and privacy; September 26 v3.0.2 routing, AI documentation and version maintenance. The first two milestone tags are retrospective.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="654" rx="20" fill="#11172a"/><text x="44" y="54" font-size="18" fill="#b9afff" font-weight="700" letter-spacing="3">FROM MINDFORGE TO ARGULAB</text><text x="44" y="104" font-size="37" fill="#f8f7fd" font-weight="700" >Built one meaningful change at a time.</text><path d="M44 165h318" stroke="#5f548c" stroke-width="2"/><circle cx="52" cy="165" r="6" fill="#b9afff"/><text x="44" y="201" font-size="17" fill="#b9afff" font-weight="700" letter-spacing="2">01–04 AUG</text><text x="44" y="244" font-size="26" fill="#f8f7fd" font-weight="700" >v1.0.0 stage*</text><text x="44" y="284" font-size="19" fill="#b4bfd2" font-weight="400" >Debate interface</text><text x="44" y="315" font-size="19" fill="#b4bfd2" font-weight="400" >Real transcript scoring</text><path d="M440 165h318" stroke="#5f548c" stroke-width="2"/><circle cx="448" cy="165" r="6" fill="#b9afff"/><text x="440" y="201" font-size="17" fill="#b9afff" font-weight="700" letter-spacing="2">05–30 AUG</text><text x="440" y="244" font-size="26" fill="#f8f7fd" font-weight="700" >The v2.0.0 stage*</text><text x="440" y="284" font-size="19" fill="#b4bfd2" font-weight="400" >Training hub + new modes</text><text x="440" y="315" font-size="19" fill="#b4bfd2" font-weight="400" >Thinking View + AI cast</text><path d="M836 165h318" stroke="#5f548c" stroke-width="2"/><circle cx="844" cy="165" r="6" fill="#b9afff"/><text x="836" y="201" font-size="17" fill="#b9afff" font-weight="700" letter-spacing="2">12 SEP</text><text x="836" y="244" font-size="26" fill="#f8f7fd" font-weight="700" >v2.0.1</text><text x="836" y="284" font-size="19" fill="#b4bfd2" font-weight="400" >Accounts + resumable history</text><text x="836" y="315" font-size="19" fill="#b4bfd2" font-weight="400" >Progress + local recording</text><path d="M44 385h318" stroke="#5f548c" stroke-width="2"/><circle cx="52" cy="385" r="6" fill="#b9afff"/><text x="44" y="421" font-size="17" fill="#b9afff" font-weight="700" letter-spacing="2">12 SEP</text><text x="44" y="464" font-size="26" fill="#f8f7fd" font-weight="700" >The deployment split</text><text x="44" y="504" font-size="19" fill="#b4bfd2" font-weight="400" >Netlify + Render + PostgreSQL</text><text x="44" y="535" font-size="19" fill="#b4bfd2" font-weight="400" >MindForge becomes Argulab</text><path d="M440 385h318" stroke="#5f548c" stroke-width="2"/><circle cx="448" cy="385" r="6" fill="#b9afff"/><text x="440" y="421" font-size="17" fill="#b9afff" font-weight="700" letter-spacing="2">19 SEP</text><text x="440" y="464" font-size="26" fill="#f8f7fd" font-weight="700" >v3.0.1</text><text x="440" y="504" font-size="19" fill="#b4bfd2" font-weight="400" >Workspaces, speech + privacy</text><text x="440" y="535" font-size="19" fill="#b4bfd2" font-weight="400" >Account deletion + accessibility</text><path d="M836 385h318" stroke="#5f548c" stroke-width="2"/><circle cx="844" cy="385" r="6" fill="#b9afff"/><text x="836" y="421" font-size="17" fill="#b9afff" font-weight="700" letter-spacing="2">26 SEP</text><text x="836" y="464" font-size="26" fill="#f8f7fd" font-weight="700" >v3.0.2</text><text x="836" y="504" font-size="19" fill="#b4bfd2" font-weight="400" >API routing + release checks</text><text x="836" y="535" font-size="19" fill="#b4bfd2" font-weight="400" >AI guide + shared versions</text><text x="44" y="608" font-size="16" fill="#8c9ab5" font-weight="700" letter-spacing="1">2026  /  SELECTED MILESTONES</text><text x="440" y="608" font-size="17" fill="#b4bfd2" font-weight="400" >*v1.0.0 / v2.0.0 tags assigned retrospectively.</text></g></svg>
