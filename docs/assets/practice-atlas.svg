<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">The practice atlas</title><desc id="desc">Make your case: debate, negotiation, case discussion. Find your voice: interview, public speaking, extempore. Read the room: group discussion, simulation, observer. Choose, respond, review, return.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="660" rx="20" fill="#f7f6f2"/><text x="44" y="54" font-size="18" fill="#6354b0" font-weight="700" letter-spacing="3">THE PRACTICE ATLAS</text><text x="44" y="104" font-size="38" fill="#142037" font-weight="700" >Nine rooms. Different conversations.</text><path d="M44 151H372" stroke="#6c56da" stroke-width="4"/><text x="44" y="196" font-size="24" fill="#6c56da" font-weight="700" >01</text><text x="44" y="243" font-size="30" fill="#142037" font-weight="700" >Make your case</text><text x="44" y="280" font-size="18" fill="#546075" font-weight="400" >Arguments, trade-offs and choices</text><text x="44" y="334" font-size="23" fill="#17213a" font-weight="500" >Debate Arena</text><path d="M44 352H372" stroke="#dddde3"/><text x="44" y="387" font-size="23" fill="#17213a" font-weight="500" >Negotiation</text><path d="M44 405H372" stroke="#dddde3"/><text x="44" y="440" font-size="23" fill="#17213a" font-weight="500" >Case Discussion</text><path d="M44 458H372" stroke="#dddde3"/><path d="M436 151H764" stroke="#2d755e" stroke-width="4"/><text x="436" y="196" font-size="24" fill="#2d755e" font-weight="700" >02</text><text x="436" y="243" font-size="30" fill="#142037" font-weight="700" >Find your voice</text><text x="436" y="280" font-size="18" fill="#546075" font-weight="400" >Answers, structure and presence</text><text x="436" y="334" font-size="23" fill="#17213a" font-weight="500" >Interview Simulator</text><path d="M436 352H764" stroke="#dddde3"/><text x="436" y="387" font-size="23" fill="#17213a" font-weight="500" >Public Speaking</text><path d="M436 405H764" stroke="#dddde3"/><text x="436" y="440" font-size="23" fill="#17213a" font-weight="500" >Extempore</text><path d="M436 458H764" stroke="#dddde3"/><path d="M828 151H1156" stroke="#a14d36" stroke-width="4"/><text x="828" y="196" font-size="24" fill="#a14d36" font-weight="700" >03</text><text x="828" y="243" font-size="30" fill="#142037" font-weight="700" >Read the room</text><text x="828" y="280" font-size="18" fill="#546075" font-weight="400" >Participation, context and analysis</text><text x="828" y="334" font-size="23" fill="#17213a" font-weight="500" >Group Discussion</text><path d="M828 352H1156" stroke="#dddde3"/><text x="828" y="387" font-size="23" fill="#17213a" font-weight="500" >Real-World Simulation</text><path d="M828 405H1156" stroke="#dddde3"/><text x="828" y="440" font-size="23" fill="#17213a" font-weight="500" >Observer Mode</text><path d="M828 458H1156" stroke="#dddde3"/><rect x="28" y="507" width="1144" height="126" rx="12" fill="#11172a"/><text x="58" y="551" font-size="17" fill="#b9afff" font-weight="700" >01</text><text x="58" y="592" font-size="23" fill="#f8f7fd" font-weight="700" >CHOOSE</text><path d="M249 578h50m-10-7 10 7-10 7" fill="none" stroke="#73829f" stroke-width="2"/><text x="348" y="551" font-size="17" fill="#b9afff" font-weight="700" >02</text><text x="348" y="592" font-size="23" fill="#f8f7fd" font-weight="700" >RESPOND</text><path d="M539 578h50m-10-7 10 7-10 7" fill="none" stroke="#73829f" stroke-width="2"/><text x="638" y="551" font-size="17" fill="#b9afff" font-weight="700" >03</text><text x="638" y="592" font-size="23" fill="#f8f7fd" font-weight="700" >REVIEW</text><path d="M829 578h50m-10-7 10 7-10 7" fill="none" stroke="#73829f" stroke-width="2"/><text x="928" y="551" font-size="17" fill="#b9afff" font-weight="700" >04</text><text x="928" y="592" font-size="23" fill="#f8f7fd" font-weight="700" >RETURN</text></g></svg>
